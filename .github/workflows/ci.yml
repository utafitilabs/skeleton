name: CI

# The skeleton's whole promise is "it boots green". This is the gate that keeps it true.
on:
  push:
    branches: ['**']   # every version line (0.1, 0.2, …) and every feature branch
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        # An installation is not a published package: create-project drops the
        # name and description, and --strict would call their absence an error.
        # "--no-check-publish: Do not emit an error if composer.json suggests
        # publishing errors" — https://getcomposer.org/doc/03-cli.md#validate
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # `install`, not `update`: this is exactly what `composer create-project`
      # resolves for someone installing the skeleton, so it is what must be green.
      - name: Install dependencies
        env:
          # Composer downloads GitHub-hosted packages through the API, which
          # rate-limits an anonymous runner; the runner's own token covers public
          # packages, and a BUNDLES_TOKEN secret is needed only where a private
          # package (the telemetry module) is installed, and wins when set.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.BUNDLES_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Smoke test (PHPUnit)
        run: composer test

  # The install guide, run as written: `docker compose up -d` for the services,
  # the Symfony CLI for everything else. On both architectures a developer
  # machine has, so a service image that exists for one only fails here first.
  services:
    name: Install guide on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP and the Symfony CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, pdo_pgsql
          coverage: none
          tools: composer:v2, symfony-cli

      - name: 1. Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.BUNDLES_TOKEN || secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 2. Start the services
        run: |
          docker compose up -d --wait
          symfony var:export --multiline | grep -E 'DATABASE_URL|MERCURE_URL|MERCURE_PUBLIC_URL|MAILER_DSN' | sed 's/:[^:@]*@/:***@/'

      - name: 3. Run the migrations
        run: |
          symfony console cache:clear --no-warmup
          symfony console doctrine:migrations:migrate --no-interaction
          symfony console registry:sync --no-interaction
          symfony console cache:warmup

      - name: 4. Create the first administrator
        run: |
          PASSPHRASE="$(openssl rand -base64 24)"
          printf '%s' "$PASSPHRASE" | symfony console team:user:create admin@example.test Ada Mwangi --tier=super-admin

      - name: 5. Serve it
        run: |
          symfony server:start -d --no-tls --port=8000
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)" = 200

      - name: The Mercure hub answers the project's address
        run: |
          HUB="$(symfony var:export --multiline | sed -n 's/^export MERCURE_PUBLIC_URL=//p')"
          curl -s --max-time 3 -o /dev/null -D headers.txt -H 'Origin: http://127.0.0.1:8000' "$HUB?topic=ci" || true
          grep -i '^access-control-allow-origin: http://127.0.0.1:8000' headers.txt

      - name: Mail reaches the mail catcher
        run: |
          symfony console mailer:test admin@example.test --subject=ci
          test "$(curl -s "http://$(docker compose port mailer 8025)/api/v1/messages" | php -r 'echo json_decode(stream_get_contents(STDIN))->total;')" -ge 1
