; How long one web request may run before PHP ends it: 30 seconds, stated
; rather than inherited so it is read next to the limit it must stay above.
;
; On this image the limit is wall time, database waits included — FrankenPHP
; is a thread-safe build, and "When PHP is compiled with
; --enable-zend-max-execution-timers (the default for ZTS builds since PHP
; 8.3.0), the limit is tracked with POSIX per-thread timers that measure
; elapsed time, so time spent sleeping or waiting on I/O counts towards it."
; https://www.php.net/manual/en/info.configuration.php#ini.max-execution-time
;
; KEEP IT ABOVE THE DATABASE STATEMENT TIMEOUT — the core's
; registry.statement_timeout_ms, DATABASE_STATEMENT_TIMEOUT_MS in .env (10
; seconds as the core's recipe writes it). PostgreSQL then cancels a runaway
; statement and the request fails with an error while PHP is still there to
; report it; the other way round PHP gives up first and the statement goes on
; running for nobody. Raise the two together.
;
; The console never has this limit: "When running PHP from the command line
; the default setting is 0."
max_execution_time = 30
