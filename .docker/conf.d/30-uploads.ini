; Upload limits sized to what the storage module accepts (storage.evidence.max_bytes,
; 12 MiB by default) plus the rest of a multipart form. The stock production
; php.ini caps a file at 2M and a POST at 8M, which truncates a phone photograph
; and the module then refuses it as a damaged upload. Both values must stay
; above the module's limit; raise them together when that limit is raised.
upload_max_filesize = 16M
post_max_size = 20M
