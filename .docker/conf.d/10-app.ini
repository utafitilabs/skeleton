; PHP settings every environment of this image gets. The block below is the
; reference deployment's own `frankenphp/conf.d/10-app.ini`, directive for
; directive, so an installation inherits what Symfony itself recommends rather
; than a local invention.
; @see https://github.com/dunglas/symfony-docker/blob/main/frankenphp/conf.d/10-app.ini
expose_php = 0
date.timezone = UTC
apc.enable_cli = 1
session.use_strict_mode = 1
zend.detect_unicode = 0

; https://symfony.com/doc/current/performance.html
; "Configure the PHP realpath Cache" — "Applications that open many PHP files,
; such as Symfony projects, should use at least these values".
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; "Configure OPcache for Maximum Performance" — "The default OPcache
; configuration is not suited for Symfony applications, so it's recommended to
; change these settings as follows".
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.memory_consumption = 256
opcache.enable_file_override = 1

; The one directive added to the reference's list. OPcache is off for the CLI by
; default — "Enables the opcode cache for the CLI version of PHP" — so without
; it every class the console compiles stays resident as uncached code and the
; cache warm-up carries the whole compiled core in the process heap. Measured on
; this project with every official module installed: a cold warm-up peaks at
; 151 MB without it and 103 MB with it, which is the difference between dying
; and finishing under php.ini-production's 128 MB memory limit. The reference
; does not need it because the skeleton it warms has a few dozen templates.
; @see https://www.php.net/manual/en/opcache.configuration.php#ini.opcache.enable-cli
opcache.enable_cli = 1
