doctrine:
    dbal:
        # The installation's connection is named, and named as the default, so a
        # module that contributes a connection of its own (telemetry's sink) can
        # never become this installation's database: DoctrineBundle takes the
        # first connection of the merged config when none is named, and a
        # module's block merges first.
        # https://symfony.com/bundles/DoctrineBundle/current/configuration.html#doctrine-dbal-configuration
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            # THIS BLOCK MAPS YOUR OWN ENTITIES, AND NOTHING ELSE. The
            # application's PHP root is `App\` (composer.json autoload.psr-4),
            # so an entity you write in src/Entity/ is mapped by these five
            # lines and would be invisible without them. `Uhifadhi\` is the
            # core's namespace and is never mapped here.
            #
            # NOTHING THE CORE OWNS DEPENDS ON IT. Each core bundle maps its own
            # entity directory and states its own resolutions, so areas, people
            # and the module registry are mapped whether or not you ever write
            # an entity of your own. The same is true of every module.
            #
            # It is kept even though a fresh installation has no entity yet:
            # this file is copied once and then belongs to the installation, and
            # this block has to be present and correct before the first entity
            # of yours can map at all.
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
