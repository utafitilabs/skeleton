
services:
###> doctrine/doctrine-bundle ###
  database:
    # PostgreSQL + PostGIS, published for linux/amd64 and linux/arm64 alike
    # (Apple Silicon included), built from the official postgres image and the
    # PGDG PostGIS packages — https://github.com/utafitilabs/postgis
    image: ghcr.io/utafitilabs/postgis:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    # Pinned to the 0.24 line: the hub that FrankenPHP bundles (v1.12.x carries
    # Mercure 0.24.2), so development speaks the protocol a FrankenPHP-served
    # installation does. Mercure 1.0 changes the subscription protocol
    # (`match=` for `topic=`, object claims, a __Secure- cookie) and drops the
    # dev.Caddyfile started below; the platform moves to it as one change.
    image: dunglas/mercure:v0.24
    restart: unless-stopped
    environment:
      # HTTPS off: the hub answers plain http on port 80, the port the Symfony
      # CLI maps to MERCURE_URL. With HTTPS on (the image's default) port 80
      # only redirects to 443, which is not published, and the address the CLI
      # hands the app answers 308.
      # https://mercure.rocks/docs/hub/install ("disable via SERVER_NAME=:80")
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      # (the Symfony CLI's address, over http and over https once its local certificate authority is installed)
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://127.0.0.1:8000 https://127.0.0.1:8000
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    # The Mercure documentation's own check: the image ships wget, not curl.
    # https://mercure.rocks/docs/hub/traefik
    # https://github.com/symfony/recipes/pull/1496
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
